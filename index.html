  .mini{width:100%;min-width:0;font-size:13px}
  .mini th,.mini td{border-bottom:1px solid var(--linea);padding:6px 6px}
  .barra{height:10px;background:var(--linea);border-radius:99px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--magenta);border-radius:99px}
  .dim{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
  .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

  .kpi .v{font-size:28px;font-weight:700;color:var(--magenta);font-variant-numeric:tabular-nums}
  .kpi .l{font-size:12.5px;color:var(--gris)}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:860px){.dos{grid-template-columns:1fr}}

  .fila .barra{height:18px;border-radius:6px}.fila .barra i{border-radius:6px}
  .fila span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--gris)}
  .est{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
  .est.a{background:var(--ok-bg);color:#14573A}.est.b{background:var(--warn-bg);color:var(--warn)}.est.c{background:var(--alert-bg);color:var(--alert)}
  .cita{border-left:4px solid var(--amarillo);background:var(--fondo);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px;margin-top:8px}
  .estado{margin-left:auto;font-size:12.5px;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;font-weight:700}
  .estado:empty{display:none}
  .salir{border:1.5px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:5px 14px;font-weight:700;font-size:12.5px;cursor:pointer}
  .salir:hover{background:#fff;color:var(--magenta)}
  .codigo{background:var(--fondo);border:1px dashed #bbb;border-radius:10px;padding:10px 14px;font-size:13.5px}
  .codigo b{font-family:"Courier New",monospace;font-size:18px;letter-spacing:2px;color:var(--magenta)}
  .iatxt{white-space:pre-line;font-size:13.5px;margin:8px 0 0}
  .nps{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
  .nps button{width:38px;height:38px;border:1px solid var(--linea);background:#fff;border-radius:8px;cursor:pointer;font-weight:700}
  .nps button.on{background:var(--magenta);border-color:var(--magenta);color:#fff}
  .err{color:var(--alert);font-size:13.5px;margin-top:8px}
  .lista{font-size:13px;margin:6px 0 0;padding-left:18px}
  a{color:var(--magenta)}
  @media print{.salir,.estado,.aviso,header .toggle,.pasos,.acciones,.noprint{display:none!important}body{background:#fff}main{padding:0}.card{border:0}}
</style>
</head>

<script>
const SB_URL="https://kblmgecnjxdupmitsgwe.supabase.co", SB_KEY="sb_publishable_B-ZO_dQv8cnyRvNLVhB-pQ_Ewc-Qsme";
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
const Q=new URLSearchParams(location.search), DEMO=Q.has("demo"), FAC=Q.has("facilitador");
const GRUPO=Q.get("g")==="1"?"2026-10-14":Q.get("g")==="2"?"2026-10-20":Q.get("g")?Q.get("g").slice(0,20):(new Date()<new Date("2026-10-17T00:00:00-05:00")?"2026-10-14":"2026-10-20");
const PASOS=['Ingreso','Recorrido','Métricas','Plan de datos','Plan 30-60-90','Mi ruta'];

  journey:[{etapa:'',accion:'',mv:false,dolor:''}],
  norte:{name:'',formula:'',meta:''},

const EJEMPLO={team:{name:'Kuna',sector:'Salud digital',etapa:'Prototipo con primeros usuarios',consent:true},

let S=JSON.parse(JSON.stringify(VACIO)), paso=0, modo=FAC?'fac':'equipo', iaVista={};

const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inp=(k,v,ph='')=>`<input type="text" data-k="${k}" value="${e(v)}" placeholder="${e(ph)}">`;

function setK(path,val){const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p.at(-1)]=val}

/* Reglas de retroalimentación inmediata */
function reglas(n){
  const r=[],ok=t=>r.push({l:'ok',t}),w=t=>r.push({l:'warn',t}),a=t=>r.push({l:'alert',t});
  const J=S.journey.filter(x=>x.etapa.trim());
  if(n===1){
    J.length>=4?ok(`Tienen ${J.length} etapas: el recorrido cubre antes, durante y después.`):w(`Van ${J.length} etapas. Lleguen al menos a 4, incluyendo qué pasa después de la primera compra o uso.`);
    J.some(x=>x.mv)?ok('Marcaron momentos de verdad: ahí conviene medir primero.'):a('Ninguna etapa está marcada como momento de verdad. ¿En cuál se gana o se pierde al cliente?');
    const d=J.filter(x=>x.dolor.trim()).length;
    d>=2?ok(`Identificaron ${d} puntos de dolor.`):w('Describan el punto de dolor en al menos 2 etapas; pueden tomarlos de lo que hallaron en el Design Sprint.');
    J.filter(x=>x.mv&&!x.dolor.trim()).forEach(x=>w(`"${x.etapa}" es momento de verdad pero no tiene punto de dolor descrito.`));
  }
  if(n===2){
    const N=S.norte, M=S.metrics.filter(x=>x.name.trim());
    if(!N.name.trim())a('Falta la métrica norte.');
    else if(/descarga|visita|seguidor|like|registro|impresion|me gusta/i.test(N.name))a(`"${N.name}" es una métrica de vanidad: sube sin que el cliente reciba valor. Prueben con una que refleje uso repetido.`);
    else ok('La métrica norte refleja valor entregado al cliente.');
    N.formula.trim()?ok('La métrica norte tiene fórmula.'):w('Escriban cómo se calcula la métrica norte; sin fórmula, cada persona la medirá distinto.');
    /\d/.test(N.meta)?ok('La métrica norte tiene meta numérica.'):w('Pongan una meta con número y plazo para la métrica norte.');
    M.length>=3?ok(`Tienen ${M.length} métricas de apoyo.`):w('Agreguen entre 3 y 5 métricas que expliquen la métrica norte.');
    M.some(x=>x.tipo==='Percepción')?ok('Incluyen una métrica de percepción.'):w('No hay métrica de percepción (NPS, CSAT o esfuerzo). Sin ella saben qué pasa, pero no por qué.');
    M.filter(x=>!/\d/.test(x.meta)).forEach(x=>w(`"${x.name}" no tiene meta.`));
  }
  if(n===3){
    const D=S.data.filter(x=>x.dato.trim());
    D.length>=3?ok(`Planean capturar ${D.length} datos.`):w('Definan al menos 3 datos por capturar.');
    const sin=J.filter(x=>x.mv&&!D.some(d=>d.etapa===x.etapa));
    sin.length?sin.forEach(x=>a(`El momento de verdad "${x.etapa}" no tiene ningún dato asociado.`)):(J.some(x=>x.mv)&&ok('Todos los momentos de verdad tienen datos asociados.'));
    D.filter(x=>x.personal&&!x.consent).forEach(x=>a(`"${x.dato}" es un dato personal sin autorización del titular (Ley 1581 de 2012).`));
    D.filter(x=>!x.resp.trim()).forEach(x=>w(`"${x.dato}" no tiene responsable.`));
    if(D.length&&D.every(x=>x.resp.trim()))ok('Cada dato tiene responsable.');
  }
  if(n===4){
    const P=S.plan;
    P.ritual.trim()?ok('Definieron un ritual de revisión.'):a('Falta el ritual: cuándo y quién revisa las métricas. Sin ritual, el tablero no se usa.');
    [['d30','30'],['d60','60'],['d90','90']].forEach(([k,d])=>P[k].trim()?ok(`Hay acción a ${d} días.`):w(`Falta la acción a ${d} días.`));
    if(P.d90.trim()&&!/\d/.test(P.d90))w('La acción a 90 días no tiene un resultado medible.');
  }
  return r;
}
const puntaje=n=>{const r=reglas(n);return r.length?Math.round(100*r.filter(x=>x.l==='ok').length/r.length):0};
const ICON={ok:'✓',warn:'!',alert:'✕'};
const IA={
 1:'El recorrido está bien enfocado en la primera cita, que es donde Kuna entrega su promesa. Falta mirar qué ocurre entre el registro y esa cita: si alguien se registra y no agenda, hoy no lo verían. Siguiente paso: agreguen la etapa "Agenda" y describan qué frena al usuario ahí.',
 2:'Las métricas de apoyo están bien construidas y tienen fórmula. El problema es la métrica norte: las descargas no dicen si alguien recibió atención. Una opción coherente con su recorrido es "citas completadas por semana". Agreguen además una calificación de la cita para entender las causas.',
 3:'Capturan lo necesario en la primera cita. El riesgo está en el registro: piden edad y motivo de consulta, que son datos sensibles de salud, sin autorización expresa. Añadan la casilla de autorización y guarden la fecha en que se aceptó.',
 4:'El ritual semanal es concreto y corto, lo cual ayuda a sostenerlo. El plan salta de 30 a 90 días: definan a 60 días una acción que conecte la instrumentación con la meta de retención, por ejemplo un recordatorio de segunda cita.'};

function promptIA(n){
  const foco={1:'el recorrido del cliente',2:'el árbol de métricas',3:'el plan de datos',4:'el ritual y el plan 30-60-90',5:'la ruta completa'}[n];

    <div class="kpi"><div class="v">${tot}</div><div class="l">Equipos conectados</div></div>
    <div class="kpi"><div class="v">${pct(fin)} %</div><div class="l">Llegaron a «Mi ruta» (${fin} de ${tot})</div></div>
    <div class="kpi"><div class="v">${satAvg===null?'—':co(satAvg.toFixed(1))}</div><div class="l">Claridad promedio, de 1 a 5</div></div>
    <div class="kpi"><div class="v">${det.length}</div><div class="l">Equipos sin avance hace más de 10 min</div></div></div>
   <div class="dos">
    <div class="card"><h2 style="font-size:17px">Embudo del taller</h2><p class="lead" style="font-size:13px">Equipos que llegaron a cada paso.</p>
      ${fu.map(x=>`<div class="fila"><span>${NOM[x.step]}</span><div class="barra"><i style="width:${pct(x.n)}%"></i></div><span>${x.n} · ${pct(x.n)} %</span></div>`).join('')}
      <div class="fila"><span>PDF descargado</span><div class="barra"><i style="width:${pct(d.pdf)}%;background:var(--gris)"></i></div><span>${d.pdf} · ${pct(d.pdf)} %</span></div></div>
    <div class="card"><h2 style="font-size:17px">Claridad y tiempo por taller</h2><p class="lead" style="font-size:13px">Respuesta a «¿qué tan claro fue este taller?» y minutos (mediana) hasta pasar al siguiente.</p>
      ${sat.map(x=>`<div class="fila"><span>Taller ${x.step}</span><div class="barra"><i style="width:${x.avg?x.avg/5*100:0}%;background:var(--naranja)"></i></div><span>${co(x.avg)} · ${co(mins[x.step])} min</span></div>`).join('')}</div>
    <div class="card"><h2 style="font-size:17px">Qué eligieron como métrica norte</h2>
      ${[['De valor para el cliente',val,'var(--magenta)'],['De vanidad',van,'var(--gris)'],['Sin definir',sin,'var(--linea)']].map(([l,v,c])=>`<div class="fila"><span>${l}</span><div class="barra"><i style="width:${pct(v)}%;background:${c}"></i></div><span>${v}</span></div>`).join('')}
      <ul class="lista">${nor.filter(Boolean).slice(0,12).map(x=>`<li>${e(x)}</li>`).join('')}</ul></div>
    <div class="card"><h2 style="font-size:17px">Recomendación del taller</h2>
      <div class="kpi" style="border:0;padding:0"><div class="v">${nps===null?'—':nps}</div><div class="l">NPS con ${d.nps?d.nps.n:0} respuestas</div></div>
      <ul class="lista">${(d.comentarios||[]).slice(0,10).map(x=>`<li>${e(x)}</li>`).join('')||'<li style="list-style:none;margin-left:-18px;color:var(--gris)">Aún no hay comentarios.</li>'}</ul></div>
   </div>
   ${F.proy?'':`<div class="card" style="margin-top:16px"><h2 style="font-size:17px">Equipos</h2><div class="tabla"><table class="mini" style="min-width:560px"><tr><th>Startup</th><th>Sector</th><th>Paso</th><th>Estado</th><th>Alertas</th><th>Métrica norte</th></tr>
     ${(d.teams||[]).map(t=>`<tr><td><b>${e(t.name)}</b></td><td>${e(t.sector||'')}</td><td>${NOM[t.step]||''}</td><td><span class="est ${t.max_step>=5?'a':t.idle_min>10?'c':'a'}">${t.max_step>=5?'En Mi ruta':t.idle_min>10?'Sin avance '+t.idle_min+' min':'Avanzando'}</span></td><td>${t.alertas??''}</td><td>${e(t.norte||'')}</td></tr>`).join('')}</table></div></div>`}`;
}
function render(){ $('#app').innerHTML=modo==='equipo'?vEquipo():vFac(); }
function ir(n){paso=Math.max(T.token||DEMO?1:0,Math.min(5,n));render();scrollTo(0,0);if(T.token){clearTimeout(guardT);guardar()}}
document.addEventListener('input',ev=>{const k=ev.target.dataset.k;if(!k)return;setK(k,ev.target.type==='checkbox'?ev.target.checked:ev.target.value);refrescar();programar()});
document.addEventListener('click',ev=>{if(ev.target.closest('.quitar,.btn.sec.min'))programar()});
window.addEventListener('beforeunload',()=>{if(T.token)guardar()});
(async function init(){
  if(!sb&&!DEMO){$('#app').innerHTML='<div class="card"><h2>No se pudo cargar la herramienta</h2><p class="lead">Revisen su conexión y recarguen la página.</p></div>';return}
  if(DEMO){const a=$('#aviso');a.hidden=false;a.textContent='Modo demostración · startup de ejemplo · nada se guarda';S=JSON.parse(JSON.stringify(EJEMPLO));paso=1;return render()}
  if(FAC){try{F.pass=sessionStorage.getItem('cx_fac')||''}catch(_){}; if(F.pass){F.timer=setInterval(facCargar,20000);return facCargar()} return render()}
  let tk=null; try{tk=localStorage.getItem('cx_token')}catch(_){}
  if(tk){const r=await cargarEquipo(tk); if(r==='ok'){render();estado(okTxt());return}
    if(r==='red'){try{const b=JSON.parse(localStorage.getItem('cx_state'));if(b){S=b;T.token=tk;paso=1;render();estado('Sin conexión: se guarda en este equipo');return}}catch(_){}}
    if(r==='no'){try{localStorage.removeItem('cx_token')}catch(_){}}}
  render();
})();
</script>
</body>
</html>
